name: Windows application

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build standalone application
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ExcellentCrates-Converter --paths src src/gui.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ExcellentCrates-Converter-Windows
          path: dist/ExcellentCrates-Converter.exe
